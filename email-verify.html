<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email - MaatrixKart</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;color:#f5f7ff;background:radial-gradient(circle at 10% 5%,rgba(45,105,255,.24),transparent 32%),radial-gradient(circle at 90% 10%,rgba(140,65,255,.23),transparent 32%),radial-gradient(circle at 50% 100%,rgba(0,180,255,.10),transparent 40%),#060912}
.box{width:100%;max-width:430px;padding:32px;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.035));backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.14);border-radius:24px;box-shadow:0 30px 70px rgba(0,0,0,.42)}
.logo{text-align:center;font-size:30px;font-weight:800;margin-bottom:25px;background:linear-gradient(90deg,#fff,#9fc8ff,#d7baff);-webkit-background-clip:text;background-clip:text;color:transparent}
.icon{text-align:center;font-size:52px;margin-bottom:8px}
h2{text-align:center;color:#fff;font-size:24px;margin-bottom:10px}
.sub{text-align:center;color:#aeb8cc;line-height:1.55;font-size:14px}
.email{margin:15px 0;text-align:center;color:#dbe7ff;font-weight:bold;word-break:break-all}
input{width:100%;padding:15px;border:1px solid rgba(255,255,255,.13);border-radius:13px;outline:none;color:#fff;background:rgba(255,255,255,.065);font-size:23px;text-align:center;letter-spacing:8px}
input:focus{border-color:rgba(100,160,255,.65);box-shadow:0 0 0 3px rgba(60,125,255,.10)}
.btn{width:100%;padding:14px;margin-top:13px;border-radius:14px;border:1px solid rgba(255,255,255,.13);color:#fff;font-weight:bold;cursor:pointer;background:rgba(255,255,255,.07)}
.primary{background:linear-gradient(135deg,#2874f0,#7048e8);box-shadow:0 12px 30px rgba(45,105,240,.25)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.message{display:none;margin-top:14px;padding:13px;border-radius:13px;line-height:1.5;font-size:14px;border:1px solid}
.error{display:block;color:#ffabb5;background:rgba(255,65,80,.16);border-color:rgba(255,80,100,.22)}
.success{display:block;color:#7be5ad;background:rgba(35,200,115,.15);border-color:rgba(60,220,140,.20)}
.links{text-align:center;margin-top:18px;color:#9ca8bb;font-size:14px;line-height:2}.links a{color:#9ec6ff;text-decoration:none}
.small{text-align:center;color:#8995aa;font-size:12px;margin-top:12px;line-height:1.5}
@media(max-width:500px){body{padding:15px}.box{padding:27px 21px}.logo{font-size:27px}}
</style>
</head>
<body>
<div class="box">
<div class="logo">MaatrixKart</div>
<div class="icon">📧</div>
<h2>Verify Your Email</h2>
<p class="sub">We sent a 6-digit verification code to:</p>
<div id="emailText" class="email">Loading...</div>

<form id="verifyForm">
<input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" aria-label="6-digit verification code" required>
<button id="verifyButton" class="btn primary" type="submit">Verify Email</button>
</form>

<button id="resendButton" class="btn" type="button">Resend Code</button>
<div id="message" class="message"></div>

<div class="small">Check your Gmail inbox and Spam/Promotions folder. The code is sent by your MaatrixKart/Supabase email service.</div>
<div class="links"><a href="register.html">← Back to Create Account</a></div>
<div class="links"><a href="login.html">Go to Login</a></div>
</div>

<script>
"use strict";
const db=window.db;
const params=new URLSearchParams(location.search);
let email=(params.get("email")||localStorage.getItem("maatrixPendingVerificationEmail")||"").trim().toLowerCase();

const emailText=document.getElementById("emailText");
const codeInput=document.getElementById("code");
const verifyButton=document.getElementById("verifyButton");
const resendButton=document.getElementById("resendButton");
const message=document.getElementById("message");

emailText.textContent=email||"No email address selected.";

function showMessage(text,type){
 message.textContent=text;
 message.className="message "+type;
 message.style.display="block";
}
function setVerifyLoading(on){
 verifyButton.disabled=on;
 verifyButton.textContent=on?"Verifying...":"Verify Email";
}
function digitsOnly(){
 codeInput.value=codeInput.value.replace(/\D/g,"").slice(0,6);
}
codeInput.addEventListener("input",digitsOnly);

if(!db)showMessage("Supabase is not connected. Check supabase-config.js.","error");

document.getElementById("verifyForm").addEventListener("submit",async e=>{
 e.preventDefault();
 message.style.display="none";
 if(!db){showMessage("Supabase is not connected.","error");return}
 if(!email){showMessage("No email address was provided. Return to registration and try again.","error");return}

 const token=codeInput.value.trim();
 if(token.length!==6){showMessage("Please enter the 6-digit code.","error");return}

 setVerifyLoading(true);
 try{
   /*
    * For a Supabase signup confirmation email, the OTP type is "signup".
    * This verifies the code sent to the same email used during registration.
    */
   const {data,error}=await db.auth.verifyOtp({
     email,
     token,
     type:"signup"
   });
   if(error)throw error;

   localStorage.setItem("maatrixLoggedIn","true");
   localStorage.setItem("maatrixUserEmail",email);
   localStorage.removeItem("maatrixPendingVerificationEmail");

   showMessage("Email verified successfully! Your account is ready.","success");
   setTimeout(()=>location.href="account.html",900);
 }catch(error){
   console.error("Email verification error:",error);
   showMessage(error.message||"Invalid or expired verification code. Request a new code and try again.","error");
   setVerifyLoading(false);
 }
});

resendButton.addEventListener("click",async()=>{
 if(!db){showMessage("Supabase is not connected.","error");return}
 if(!email){showMessage("No email address was provided.","error");return}

 resendButton.disabled=true;
 resendButton.textContent="Sending...";
 message.style.display="none";

 try{
   const {error}=await db.auth.resend({type:"signup",email});
   if(error)throw error;
   showMessage("A new 6-digit verification code has been sent to your email.","success");
 }catch(error){
   console.error("Resend error:",error);
   showMessage(error.message||"Could not resend the code. Please wait and try again.","error");
 }finally{
   setTimeout(()=>{resendButton.disabled=false;resendButton.textContent="Resend Code"},1200);
 }
});
</script>
</body>
</html>
